<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>getblit</title>
<meta name="description" content="Call it right. Climb the board. Nigerian prediction markets on NGX, FX, football, politics and entertainment." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0F1B14; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  .sg { font-family: 'Space Grotesk', sans-serif; }
  .side-btn:active { transform: scale(0.97); }
  ::-webkit-scrollbar { display: none; }
  input:focus { outline: 1px solid #1FA35B; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// --- Supabase setup ---
const supabase = window.supabase.createClient(
  "https://zudhrvqbjmhhcdmwhebu.supabase.co",
  "sb_publishable_fPs3IAjOxrJx2qR10t5vtA_EAtmBj2i"
);

const CATEGORIES = ["All", "NGX", "FX", "Football", "Politics", "Naija Ent"];
const STAKE = 100;

const STATIC_EVENTS = [
  { id: 3, category: "Football", question: "Super Eagles to win their next AFCON qualifier?", yes: 71, no: 29, closes: "Sat, kickoff", hot: true },
  { id: 4, category: "Politics", question: "Fuel subsidy debate resolved before month end?", yes: 27, no: 73, closes: "Sep 30", hot: false },
  { id: 5, category: "Naija Ent", question: "Will this week's BBN eviction be a top-3 favorite?", yes: 33, no: 67, closes: "Sun, 10pm", hot: true },
];

const LEADERBOARD = [
  { rank: 1, name: "Chiamaka_V", points: 14250 },
  { rank: 2, name: "OluOfLagos", points: 12980 },
  { rank: 3, name: "Emeka_Predicts", points: 11430 },
  { rank: 4, name: "You", points: 8600, isUser: true },
  { rank: 5, name: "TundeTrades", points: 7920 },
];

const NGX_TICKERS = [
  { symbol: "DANGCEM", name: "Dangote Cement" },
  { symbol: "GTCO", name: "GTCO" },
  { symbol: "MTNN", name: "MTN Nigeria" },
];

// --- tiny inline icon set (no icon library needed) ---
const Icon = {
  flame: (p) => <svg width={p.size||14} height={p.size||14} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="2"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1.5-.5-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-4 3-6 5-11z"/></svg>,
  trophy: (p) => <svg width={p.size||18} height={p.size||18} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="2"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 01-10 0V4zM7 5H4a3 3 0 003 3M17 5h3a3 3 0 01-3 3"/></svg>,
  wallet: (p) => <svg width={p.size||14} height={p.size||14} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M17 15h.01"/></svg>,
  check: (p) => <svg width={p.size||12} height={p.size||12} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>,
  settings: (p) => <svg width={p.size||15} height={p.size||15} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>,
  refresh: (p) => <svg width={p.size||13} height={p.size||13} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="2"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg>,
  alert: (p) => <svg width={p.size||13} height={p.size||13} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>,
  user: (p) => <svg width={p.size||14} height={p.size||14} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>,
  google: (p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>,
};

function App() {
  const [view, setView] = useState("feed");
  const [category, setCategory] = useState("All");
  const [points, setPoints] = useState(8600);
  const [picks, setPicks] = useState({});
  const [toast, setToast] = useState(null);
  const [showSettings, setShowSettings] = useState(false);

  const [fxRate, setFxRate] = useState(null);
  const [fxStatus, setFxStatus] = useState("loading");

  const [mansaKey, setMansaKey] = useState("");
  const [ngxQuotes, setNgxQuotes] = useState({});
  const [ngxStatus, setNgxStatus] = useState("idle");

  const [liveOdds, setLiveOdds] = useState({ fx: { yes: 62, no: 38 }, dangcem: { yes: 44, no: 56 } });

  // --- auth state ---
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [showAuth, setShowAuth] = useState(false);
  const [authMode, setAuthMode] = useState("signin"); // "signin" | "signup"
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authError, setAuthError] = useState("");
  const [authBusy, setAuthBusy] = useState(false);
  const [authNotice, setAuthNotice] = useState("");

  useEffect(() => { fetchFx(); }, []);

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => {
      setUser(session?.user ?? null);
      setAuthLoading(false);
    });
    const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session?.user ?? null);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  async function fetchFx() {
    setFxStatus("loading");
    try {
      const res = await fetch("https://open.er-api.com/v6/latest/USD");
      const data = await res.json();
      if (data.result === "success" && data.rates && data.rates.NGN) {
        setFxRate(data.rates.NGN);
        setFxStatus("live");
      } else {
        setFxStatus("error");
      }
    } catch (e) {
      setFxStatus("error");
    }
  }

  async function fetchNgx(key) {
    if (!key) return;
    setNgxStatus("loading");
    try {
      const results = {};
      for (const t of NGX_TICKERS) {
        const res = await fetch(`https://mansaapi.com/api/v1/markets/exchanges/NGX/stocks/${t.symbol}`, {
          headers: { Authorization: `Bearer ${key}` },
        });
        if (!res.ok) throw new Error("request failed");
        const data = await res.json();
        results[t.symbol] = data.data || data;
      }
      setNgxQuotes(results);
      setNgxStatus("live");
    } catch (e) {
      setNgxStatus("error");
    }
  }

  // --- auth actions ---
  async function handleAuthSubmit(ev) {
    ev.preventDefault();
    setAuthError("");
    setAuthNotice("");
    setAuthBusy(true);
    try {
      if (authMode === "signup") {
        const { error } = await supabase.auth.signUp({ email: authEmail, password: authPassword });
        if (error) throw error;
        setAuthNotice("Check your email to confirm your account, then sign in.");
        setAuthMode("signin");
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email: authEmail, password: authPassword });
        if (error) throw error;
        setShowAuth(false);
        setAuthEmail("");
        setAuthPassword("");
        setToast("Signed in.");
        setTimeout(() => setToast(null), 1500);
      }
    } catch (err) {
      setAuthError(err.message || "Something went wrong.");
    } finally {
      setAuthBusy(false);
    }
  }

  async function handleGoogleSignIn() {
    setAuthError("");
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin },
    });
    if (error) setAuthError(error.message);
  }

  async function handleSignOut() {
    await supabase.auth.signOut();
    setShowSettings(false);
    setToast("Signed out.");
    setTimeout(() => setToast(null), 1500);
  }

  const fxThreshold = fxRate ? Math.ceil(fxRate / 25) * 25 : 1650;
  const dangcem = ngxQuotes["DANGCEM"];

  const liveEvents = [
    {
      id: 1,
      category: "FX",
      question: `Will USD/NGN close above ₦${fxThreshold.toLocaleString()} this Friday?`,
      context: fxStatus === "live" ? `Live rate: ₦${fxRate.toFixed(2)}` : fxStatus === "loading" ? "Fetching live rate…" : "Live rate unavailable — showing last known odds",
      yes: liveOdds.fx.yes, no: liveOdds.fx.no, closes: "Fri, 5pm WAT", hot: true, live: fxStatus === "live",
    },
    {
      id: 2,
      category: "NGX",
      question: "Will Dangote Cement gain 3%+ this week?",
      context: ngxStatus === "live" && dangcem ? `Live: ₦${dangcem.price ?? "—"} (${dangcem.change_percent ?? dangcem.changePercent ?? "—"}% today)` : ngxStatus === "loading" ? "Fetching live price…" : "Add a free Mansa API key in Settings for live NGX prices",
      yes: liveOdds.dangcem.yes, no: liveOdds.dangcem.no, closes: "Fri, close", hot: false, live: ngxStatus === "live",
    },
  ];

  const events = [...liveEvents, ...STATIC_EVENTS];
  const filtered = category === "All" ? events : events.filter((e) => e.category === category);

  function placePick(eventId, side) {
    if (!user) {
      setShowAuth(true);
      setAuthMode("signin");
      return;
    }
    if (picks[eventId]) return;
    if (points < STAKE) {
      setToast("Not enough points to predict.");
      setTimeout(() => setToast(null), 1800);
      return;
    }
    setPoints((p) => p - STAKE);
    setPicks((p) => ({ ...p, [eventId]: side }));
    if (eventId === 1) setLiveOdds((o) => bump(o, "fx", side));
    else if (eventId === 2) setLiveOdds((o) => bump(o, "dangcem", side));
    setToast(`Staked ${STAKE} pts on ${side.toUpperCase()}`);
    setTimeout(() => setToast(null), 1800);
  }

  function bump(o, key, side) {
    const cur = o[key];
    const shift = 2;
    const next = side === "yes"
      ? { yes: Math.min(96, cur.yes + shift), no: Math.max(4, cur.no - shift) }
      : { no: Math.min(96, cur.no + shift), yes: Math.max(4, cur.yes - shift) };
    return { ...o, [key]: next };
  }

  const colors = {
    bg: "#0F1B14", surface: "#16241C", surface2: "#1D2E23",
    green: "#1FA35B", gold: "#F2B705", text: "#F5F2EA",
    muted: "#93A599", red: "#E4572E", border: "#25382C",
  };

  return (
    <div style={{ fontFamily: "Inter, system-ui, sans-serif", background: colors.bg, color: colors.text, minHeight: "100vh", maxWidth: 480, margin: "0 auto", position: "relative" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 10, background: colors.bg, borderBottom: `1px solid ${colors.border}`, padding: "16px 16px 0 16px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div className="sg" style={{ fontSize: 20, fontWeight: 700, letterSpacing: -0.3 }}>getblit</div>
            <div style={{ fontSize: 12, color: colors.muted, marginTop: 2 }}>Call it right. Climb the board.</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {!authLoading && (
              user ? (
                <button onClick={() => setShowSettings(true)} title={user.email} style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 999, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: colors.green }}>
                  <Icon.user />
                </button>
              ) : (
                <button onClick={() => { setShowAuth(true); setAuthMode("signin"); }} style={{ background: colors.green, border: "none", borderRadius: 999, padding: "8px 14px", cursor: "pointer", color: "#0F1B14", fontWeight: 700, fontSize: 13 }}>
                  Sign In
                </button>
              )
            )}
            <button onClick={() => setShowSettings(true)} style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 999, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: colors.muted }}>
              <Icon.settings />
            </button>
            <div style={{ display: "flex", alignItems: "center", gap: 6, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 999, padding: "8px 12px" }}>
              <Icon.wallet color={colors.gold} />
              <span className="sg" style={{ fontWeight: 600, fontSize: 14 }}>{points.toLocaleString()}</span>
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 20, marginTop: 16 }}>
          {[{ id: "feed", label: "Predictions" }, { id: "board", label: "Leaderboard" }].map((t) => (
            <button key={t.id} onClick={() => setView(t.id)} style={{ background: "none", border: "none", color: view === t.id ? colors.text : colors.muted, fontWeight: 600, fontSize: 14, padding: "0 0 12px 0", cursor: "pointer", borderBottom: view === t.id ? `2px solid ${colors.green}` : "2px solid transparent" }}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {view === "feed" && (
        <>
          <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "14px 16px 4px 16px" }}>
            {CATEGORIES.map((c) => (
              <button key={c} onClick={() => setCategory(c)} style={{ flexShrink: 0, padding: "6px 14px", borderRadius: 999, border: `1px solid ${colors.border}`, background: category === c ? colors.green : colors.surface, color: category === c ? "#0F1B14" : colors.muted, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                {c}
              </button>
            ))}
          </div>

          <div style={{ padding: "12px 16px 90px 16px", display: "flex", flexDirection: "column", gap: 12 }}>
            {filtered.map((e) => {
              const picked = picks[e.id];
              return (
                <div key={e.id} style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 14, padding: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: colors.gold, background: "rgba(242,183,5,0.1)", padding: "3px 8px", borderRadius: 6 }}>{e.category}</span>
                    {e.hot && <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: colors.red }}><Icon.flame color={colors.red} /> Trending</span>}
                    {e.live && <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: colors.green }}><span style={{ width: 6, height: 6, borderRadius: 99, background: colors.green }} /> Live</span>}
                  </div>
                  <div style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.4, marginBottom: 4 }}>{e.question}</div>
                  <div style={{ fontSize: 12, color: colors.muted, marginBottom: 12 }}>{e.context || "\u00A0"}</div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                    <button className="side-btn" disabled={!!picked} onClick={() => placePick(e.id, "yes")} style={{ flex: 1, padding: "10px 0", borderRadius: 10, border: picked === "yes" ? `1px solid ${colors.green}` : `1px solid ${colors.border}`, background: picked === "yes" ? "rgba(31,163,91,0.15)" : colors.surface2, color: picked === "yes" ? colors.green : colors.text, cursor: picked ? "default" : "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                      <span style={{ fontSize: 11, color: colors.muted, fontWeight: 600 }}>YES</span>
                      <span className="sg" style={{ fontSize: 16, fontWeight: 700 }}>{e.yes}%</span>
                    </button>
                    <button className="side-btn" disabled={!!picked} onClick={() => placePick(e.id, "no")} style={{ flex: 1, padding: "10px 0", borderRadius: 10, border: picked === "no" ? `1px solid ${colors.red}` : `1px solid ${colors.border}`, background: picked === "no" ? "rgba(228,87,46,0.15)" : colors.surface2, color: picked === "no" ? colors.red : colors.text, cursor: picked ? "default" : "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                      <span style={{ fontSize: 11, color: colors.muted, fontWeight: 600 }}>NO</span>
                      <span className="sg" style={{ fontSize: 16, fontWeight: 700 }}>{e.no}%</span>
                    </button>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: colors.muted }}>
                    <span>Closes {e.closes}</span>
                    {picked ? <span style={{ display: "flex", alignItems: "center", gap: 4, color: colors.green }}><Icon.check color={colors.green} /> {STAKE} pts staked</span> : <span>Stake {STAKE} pts</span>}
                  </div>
                </div>
              );
            })}
            <div style={{ fontSize: 10, color: colors.muted, textAlign: "center", marginTop: 8 }}>FX rates by exchangerate-api.com</div>
          </div>
        </>
      )}

      {view === "board" && (
        <div style={{ padding: "16px 16px 90px 16px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
            <Icon.trophy color={colors.gold} />
            <span className="sg" style={{ fontSize: 16, fontWeight: 700 }}>This week's top predictors</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {LEADERBOARD.map((u) => (
              <div key={u.rank} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: u.isUser ? "rgba(31,163,91,0.1)" : colors.surface, border: u.isUser ? `1px solid ${colors.green}` : `1px solid ${colors.border}`, borderRadius: 12, padding: "12px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span className="sg" style={{ width: 24, textAlign: "center", fontWeight: 700, color: u.rank <= 3 ? colors.gold : colors.muted }}>{u.rank}</span>
                  <span style={{ fontWeight: u.isUser ? 700 : 500, fontSize: 14 }}>{u.name}</span>
                </div>
                <span className="sg" style={{ fontWeight: 600, fontSize: 14, color: colors.gold }}>{u.points.toLocaleString()}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {showSettings && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 20 }} onClick={() => setShowSettings(false)}>
          <div onClick={(ev) => ev.stopPropagation()} style={{ background: colors.surface, borderTop: `1px solid ${colors.border}`, borderRadius: "18px 18px 0 0", padding: 20, width: "100%", maxWidth: 480 }}>
            {user && (
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, paddingBottom: 16, borderBottom: `1px solid ${colors.border}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 999, background: colors.surface2, display: "flex", alignItems: "center", justifyContent: "center", color: colors.green }}>
                    <Icon.user />
                  </div>
                  <div style={{ fontSize: 13, color: colors.text }}>{user.email}</div>
                </div>
                <button onClick={handleSignOut} style={{ background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 8, padding: "8px 12px", color: colors.red, fontWeight: 600, fontSize: 12, cursor: "pointer" }}>Sign Out</button>
              </div>
            )}
            <div className="sg" style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Live data sources</div>
            <div style={{ fontSize: 12, color: colors.muted, marginBottom: 16 }}>FX is live automatically. NGX stock prices need a free Mansa API key.</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, fontSize: 13 }}>
              {fxStatus === "live" ? (<><span style={{ width: 8, height: 8, borderRadius: 99, background: colors.green }} />USD/NGN live at ₦{fxRate?.toFixed(2)}</>) :
               fxStatus === "loading" ? (<><Icon.refresh /> Fetching FX rate…</>) :
               (<><Icon.alert color={colors.red} /> FX fetch failed<button onClick={fetchFx} style={{ marginLeft: "auto", background: "none", border: "none", color: colors.green, cursor: "pointer", fontSize: 12 }}>Retry</button></>)}
            </div>
            <label style={{ fontSize: 12, color: colors.muted, display: "block", marginBottom: 6 }}>Mansa API key (free at mansaapi.com)</label>
            <div style={{ display: "flex", gap: 8 }}>
              <input type="password" value={mansaKey} onChange={(e) => setMansaKey(e.target.value)} placeholder="mansa_live_sk_..." style={{ flex: 1, background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 8, padding: "10px 12px", color: colors.text, fontSize: 13 }} />
              <button onClick={() => fetchNgx(mansaKey)} style={{ background: colors.green, border: "none", borderRadius: 8, padding: "0 16px", color: "#0F1B14", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Connect</button>
            </div>
            {ngxStatus === "error" && <div style={{ fontSize: 12, color: colors.red, marginTop: 8 }}>Couldn't fetch NGX data — check the key and the endpoint in mansaapi.com/docs.</div>}
            {ngxStatus === "live" && <div style={{ fontSize: 12, color: colors.green, marginTop: 8 }}>NGX prices connected.</div>}
            <button onClick={() => setShowSettings(false)} style={{ width: "100%", marginTop: 18, background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "12px 0", color: colors.text, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>Done</button>
          </div>
        </div>
      )}

      {showAuth && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 30 }} onClick={() => setShowAuth(false)}>
          <div onClick={(ev) => ev.stopPropagation()} style={{ background: colors.surface, borderTop: `1px solid ${colors.border}`, borderRadius: "18px 18px 0 0", padding: 20, width: "100%", maxWidth: 480 }}>
            <div className="sg" style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>
              {authMode === "signin" ? "Sign in to getblit" : "Create your account"}
            </div>
            <div style={{ fontSize: 12, color: colors.muted, marginBottom: 16 }}>
              {authMode === "signin" ? "Sign in to make predictions and climb the board." : "No real money — just points, bragging rights, and leaderboard glory."}
            </div>

            {authNotice && <div style={{ fontSize: 12, color: colors.green, background: "rgba(31,163,91,0.1)", border: `1px solid ${colors.green}`, borderRadius: 8, padding: "8px 10px", marginBottom: 12 }}>{authNotice}</div>}
            {authError && <div style={{ fontSize: 12, color: colors.red, background: "rgba(228,87,46,0.1)", border: `1px solid ${colors.red}`, borderRadius: 8, padding: "8px 10px", marginBottom: 12 }}>{authError}</div>}

            <button onClick={handleGoogleSignIn} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 10, background: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer", marginBottom: 14 }}>
              <Icon.google /> Continue with Google
            </button>

            <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "4px 0 16px 0" }}>
              <div style={{ flex: 1, height: 1, background: colors.border }} />
              <span style={{ fontSize: 11, color: colors.muted }}>or</span>
              <div style={{ flex: 1, height: 1, background: colors.border }} />
            </div>

            <form onSubmit={handleAuthSubmit}>
              <label style={{ fontSize: 12, color: colors.muted, display: "block", marginBottom: 6 }}>Email</label>
              <input type="email" required value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="you@example.com" style={{ width: "100%", background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 8, padding: "10px 12px", color: colors.text, fontSize: 13, marginBottom: 12 }} />
              <label style={{ fontSize: 12, color: colors.muted, display: "block", marginBottom: 6 }}>Password</label>
              <input type="password" required minLength={6} value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" style={{ width: "100%", background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 8, padding: "10px 12px", color: colors.text, fontSize: 13, marginBottom: 16 }} />
              <button type="submit" disabled={authBusy} style={{ width: "100%", background: colors.green, border: "none", borderRadius: 10, padding: "12px 0", color: "#0F1B14", fontWeight: 700, fontSize: 14, cursor: authBusy ? "default" : "pointer", opacity: authBusy ? 0.7 : 1 }}>
                {authBusy ? "Please wait…" : authMode === "signin" ? "Sign In" : "Sign Up"}
              </button>
            </form>

            <div style={{ textAlign: "center", marginTop: 14, fontSize: 12, color: colors.muted }}>
              {authMode === "signin" ? (
                <>New here? <span onClick={() => { setAuthMode("signup"); setAuthError(""); setAuthNotice(""); }} style={{ color: colors.green, fontWeight: 600, cursor: "pointer" }}>Create an account</span></>
              ) : (
                <>Already have an account? <span onClick={() => { setAuthMode("signin"); setAuthError(""); setAuthNotice(""); }} style={{ color: colors.green, fontWeight: 600, cursor: "pointer" }}>Sign in</span></>
              )}
            </div>

            <button onClick={() => setShowAuth(false)} style={{ width: "100%", marginTop: 18, background: "none", border: "none", color: colors.muted, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>Cancel</button>
          </div>
        </div>
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "10px 18px", fontSize: 13, fontWeight: 600, maxWidth: 440, width: "calc(100% - 48px)", textAlign: "center" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
